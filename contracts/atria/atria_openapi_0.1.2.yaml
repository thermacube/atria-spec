openapi: 3.1.0
info:
  title: Atria LMS HTTP API (MVP)
  version: 0.1.2
  description: Generated from HTTP API and HTMX Interaction Spec 0.1.2 endpoint catalogue.
    HTML endpoints are included for completeness; JSON request/response bodies are
    minimal and must be kept consistent with Spec 0.2 message contracts.
servers:
- url: https://{tenant_host}
  variables:
    tenant_host:
      default: example.thermacube.local
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: atria_session
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type:
          - object
          - 'null'
        correlation_id:
          type: string
          format: uuid
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Client-provided idempotency key for retry-safe POST operations.
paths:
  /login:
    get:
      summary: Begin OIDC login
      description: No evidence; redirects to IdP
      parameters: []
      responses:
        '200':
          description: HTML response
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /logout:
    post:
      summary: End session
      description: No learner truth changes
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: false
  /dashboard:
    get:
      summary: Learner dashboard
      description: Reads progression_state and course enrollments
      parameters: []
      responses:
        '200':
          description: HTML response
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /courses/{course_id}:
    get:
      summary: Course overview
      description: Shows workflow_version and current activity
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: HTML response
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /courses/{course_id}/activities/{activity_uuid}:
    get:
      summary: Activity view
      description: Renders content/assessment/tool launcher; reads activity_resolution
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activity_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: HTML response
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /courses/{course_id}/activities/{activity_uuid}/content/access:
    post:
      summary: Record content access
      description: Creates ContentAccessRecorded (FACT) (content_version_id required;
        content_version and content_hash optional)
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activity_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content_version_id
              properties:
                content_version_id:
                  type: string
                  format: uuid
                content_version:
                  type: string
                content_hash:
                  type: string
              additionalProperties: false
      x-atria-emits-evidence:
      - ContentAccessRecorded
  /courses/{course_id}/activities/{activity_uuid}/assessment/attempts:
    post:
      summary: Create new attempt
      description: Creates AssessmentAttemptStarted (FACT); allocates attempt_number
        via counter
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activity_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /attempts/{attempt_id}/submissions:
    post:
      summary: Submit attempt
      description: Creates AssessmentAttemptSubmitted (FACT) and AssessmentAttemptCompleted
        (FACT)
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - submission_reference
              properties:
                submission_reference:
                  type: string
                content_type:
                  type: string
                bytes:
                  type: integer
                  minimum: 0
                schema_version:
                  type: string
              additionalProperties: false
      x-atria-emits-evidence:
      - AssessmentAttemptSubmitted
      - AssessmentAttemptCompleted
  /instructor/courses/{course_id}:
    get:
      summary: Instructor course view
      description: Lists submissions needing grading; role required
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: HTML response
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /instructor/submissions/{submission_id}/grade:
    post:
      summary: Record score
      description: Creates AssessmentScoreComputed (FACT); may trigger Ordin decisions;
        regrades emit AssessmentScoreSuperseded (FACT) as applicable
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - score
              - grading_schema_version
              properties:
                score:
                  anyOf:
                  - type: number
                  - type: object
                  - type: string
                grading_schema_version:
                  type: string
                is_pass:
                  type:
                  - boolean
                  - 'null'
                comment:
                  type: string
              additionalProperties: false
      x-atria-emits-evidence:
      - AssessmentScoreComputed
      - AssessmentScoreSuperseded
  /admin/courses/{course_id}/publish:
    post:
      summary: Publish workflow version
      description: Creates CourseVersionPublished (FACT); writes workflow_definition
        + activity_resolution
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content (HTMX swap or redirect may occur)
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workflow_version
              properties:
                workflow_version:
                  type: string
                definition_ref:
                  type: string
                definition_hash:
                  type: string
              additionalProperties: false
      x-atria-emits-evidence:
      - CourseVersionPublished
